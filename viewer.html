<!doctype html><meta charset="utf-8"><title>Unitree L2 · 5090</title><style>body{margin:0;background:#09121c;color:#dce9f6;font:15px system-ui}header{padding:18px}button,input{margin:6px}canvas{display:block;width:100vw;height:78vh}#status{color:#6ee7c1}</style><header><b>UNITREE L2 · POINT CLOUD</b><p id="status">Connecting…</p><label>Range <input id="range" type="range" min="0.25" step="0.25" max="40" value="1.5"> <span id="r">1.5</span> m</label><button onclick="range.value=1.5;document.getElementById('r').textContent=1.5;zoom=200;pitch=.55">Nearby (1.5 m)</button><button onclick="baseline=new Set(points.map(voxel));compare=true">Mark empty scene</button><button onclick="compare=false">Show all points</button><button onclick="yaw=0;pitch=Math.PI/2">Top</button><button onclick="yaw=0;pitch=.1">Side</button><button onclick="paused=!paused">Pause display</button><span>Drag to rotate · wheel to zoom · colors show height · 0.6-second accumulation | Compare: remove object, mark empty scene, replace object</span></header><canvas id="c"></canvas><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let yaw=.5,pitch=.55,zoom=200,points=[],paused=false,drag=false,old;let baseline=new Set(),compare=false;const voxel=p=>p.slice(0,3).map(v=>Math.floor(v/.03)).join(',');let range=document.getElementById('range');range.oninput=()=>document.getElementById('r').textContent=range.value;c.onpointerdown=e=>{drag=true;old=e;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointermove=e=>{if(drag){yaw+=(e.clientX-old.clientX)*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-old.clientY)*.008));old=e}};c.onwheel=e=>{e.preventDefault();zoom=Math.max(2,Math.min(1000,zoom*Math.exp(-e.deltaY*.001)))};
function draw(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=c.clientWidth,h=c.clientHeight;ctx.fillStyle='#09121c';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#253746';for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(w/2+i*zoom,0);ctx.lineTo(w/2+i*zoom,h);ctx.stroke()}const project=(x,y,z)=>{let a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return [w/2+a*zoom,h/2+(b*Math.sin(pitch)-z*Math.cos(pitch))*zoom]};ctx.strokeStyle='#4d667a';ctx.fillStyle='#b0c4d6';for(let radius of [.25,.5,1,1.5]){ctx.beginPath();for(let j=0;j<=100;j++){let t=j*Math.PI/50,q=project(radius*Math.cos(t),radius*Math.sin(t),0);if(j===0)ctx.moveTo(...q);else ctx.lineTo(...q)}ctx.stroke();let q=project(radius,0,0);ctx.fillText(radius+' m',q[0],q[1])}ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(w/2,h/2,5,0,7);ctx.fill();ctx.fillText('LiDAR origin',w/2+8,h/2+16);ctx.fillText(compare?'CHANGE VIEW: orange = returns outside baseline 3 cm voxels; may include noise or motion':'NEAR VIEW: distance rings are on sensor z=0 plane',16,22);for(let [x,y,z] of points){if(x*x+y*y+z*z>range.value**2)continue;let a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw),v=b*Math.sin(pitch)-z*Math.cos(pitch);ctx.fillStyle=`hsl(${Math.max(0,Math.min(250,180-z*35))} 85% 65%)`;if(compare)ctx.fillStyle=baseline.has(voxel([x,y,z]))?'#344454':'#ff9e45';ctx.fillRect(w/2+a*zoom,h/2+v*zoom,compare?3:2,compare?3:2)}requestAnimationFrame(draw)}draw();
async function poll(){try{let d=await(await fetch('/api')).json();if(!paused)points=d.points;document.getElementById('status').textContent='['+(d.mode||'live').toUpperCase()+'] '+(d.error?'ERROR: '+d.error:d.age_s===null?'WAITING FOR SENSOR':d.age_s>.5?'STALE — no fresh scan':'RECEIVING')+` | ${d.scans} slices | ${d.total_points} points | ${d.invalid} invalid | ${d.sequence_gaps} missing | age ${d.age_s??'—'} s`;if(d.age_s===null||d.age_s>.6)points=[]}catch(e){document.getElementById('status').textContent='Viewer disconnected';points=[]}setTimeout(poll,150)}poll();</script>
